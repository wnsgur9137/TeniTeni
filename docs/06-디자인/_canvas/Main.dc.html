<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin:0; font-family:-apple-system,"SF Pro Text",system-ui,sans-serif; }
    a { color:#C6F24E; } a:hover { color:#D9F87E; }
    .num { font-variant-numeric: tabular-nums; }
  </style>
</helmet>
<div style="width:390px;height:844px;background:#0B0D0F;color:#F2F4F6;display:flex;flex-direction:column;overflow:hidden">

  <div style="flex:1;position:relative;background:linear-gradient(160deg,#1a2416 0%,#0f1a12 55%,#0B0D0F 100%)">

    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
      <svg width="230" height="330" viewBox="0 0 230 330" fill="none">
        <g stroke="rgba(255,255,255,0.72)" stroke-width="5" stroke-linecap="round">
          <line x1="115" y1="84" x2="115" y2="168"/>
          <line x1="115" y1="96" x2="72" y2="120"/>
          <line x1="115" y1="168" x2="86" y2="232"/>
          <line x1="115" y1="168" x2="146" y2="232"/>
          <line x1="86" y1="232" x2="79" y2="300"/>
          <line x1="146" y1="232" x2="155" y2="300"/>
        </g>
        <g stroke="#4DD8E6" stroke-width="6" stroke-linecap="round">
          <line x1="115" y1="96" x2="163" y2="118"/>
          <line x1="163" y1="118" x2="196" y2="76"/>
        </g>
        <circle cx="115" cy="70" r="15" fill="none" stroke="rgba(255,255,255,0.72)" stroke-width="5"/>
        <g fill="#FFFFFF">
          <circle cx="115" cy="96" r="5"/><circle cx="72" cy="120" r="5"/>
          <circle cx="115" cy="168" r="5"/><circle cx="86" cy="232" r="5"/>
          <circle cx="146" cy="232" r="5"/><circle cx="79" cy="300" r="5"/>
          <circle cx="155" cy="300" r="5"/><circle cx="196" cy="76" r="5"/>
        </g>
        <circle cx="163" cy="118" r="9" fill="#FF4D4D"/>
        <path d="M196 76 C 214 58, 222 44, 226 30" stroke="#FFD84D" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.85"/>
        <circle cx="226" cy="28" r="6" fill="#FFD84D"/>
      </svg>
    </div>

    <div style="position:absolute;left:20px;top:24px;display:flex;flex-direction:column;gap:6px">
      <div style="font-size:11px;font-weight:600;letter-spacing:0.12em;color:#6B737B">TENITENI</div>
      <div style="font-size:28px;font-weight:700;line-height:1.15;max-width:250px">스윙을 보고<br>무엇을 고칠지 안다</div>
    </div>
  </div>

  <div style="padding:24px 20px 32px;display:flex;flex-direction:column;gap:20px;background:#0B0D0F">
    <div style="display:flex;flex-direction:column;gap:14px">
      <div style="display:flex;gap:12px;align-items:flex-start">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" style="flex-shrink:0;margin-top:1px">
          <rect x="3" y="6" width="14" height="10" rx="2" stroke="#C6F24E" stroke-width="1.6"/>
          <path d="M10 2v4M7 19h6" stroke="#C6F24E" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <div style="display:flex;flex-direction:column;gap:2px">
          <div style="font-size:15px;font-weight:600">삼각대에 세워두세요</div>
          <div style="font-size:13px;color:#9BA3AB;line-height:1.45">코트 옆 6m, 허리 높이, 가로로.<br>흔들리면 공 궤적을 잡지 못합니다.</div>
        </div>
      </div>
      <div style="display:flex;gap:12px;align-items:flex-start">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" style="flex-shrink:0;margin-top:1px">
          <path d="M3 14l4-5 3 3 3-5 4 7" stroke="#C6F24E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div style="display:flex;flex-direction:column;gap:2px">
          <div style="font-size:15px;font-weight:600">치기만 하면 됩니다</div>
          <div style="font-size:13px;color:#9BA3AB;line-height:1.45">스윙을 자동으로 찾아 기록합니다.<br>폰을 보러 올 필요 없습니다.</div>
        </div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px">
      <button style="height:52px;border:none;border-radius:10px;background:#C6F24E;color:#0B0D0F;font-size:17px;font-weight:600;font-family:inherit;cursor:pointer">시작하기</button>
      <div style="text-align:center;font-size:13px;color:#6B737B">카메라와 마이크 권한이 필요합니다</div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
