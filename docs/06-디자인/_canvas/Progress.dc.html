<!doctype html>
<html>

<x-dc>

</style></helmet>
<div style="width:390px;height:844px;background:#0B0D0F;color:#F2F4F6;display:flex;flex-direction:column">

      <span style="font-size:13px;font-weight:600;padding:7px 14px;border-radius:999px;background:#C6F24E;color:#0B0D0F">8주</span>
      <span style="font-size:13px;font-weight:500;padding:7px 14px;border-radius:999px;background:#16191D;color:#9BA3AB">6개월</span>

  </div>

  <div style="padding:0 20px 16px">

            <span class="num" style="font-size:13px;font-weight:600;color:#3DDC84">+11</span>

        </div>
        <div class="num" style="font-size:11px;color:#6B737B;padding-top:4px">8주간</div>
      </div>

      <div style="position:relative;height:130px">
        <svg width="326" height="130" viewBox="0 0 326 130" fill="none" style="overflow:visible">
          <g stroke="#1F2429" stroke-width="1">
            <line x1="0" y1="4" x2="308" y2="4"/>
            <line x1="0" y1="39" x2="308" y2="39"/>
            <line x1="0" y1="74" x2="308" y2="74"/>
            <line x1="0" y1="109" x2="308" y2="109"/>
          </g>
          <path d="M0 81.3 L44 67 L88 71.8 L132 47.9 L176 57.4 L220 38.3 L264 43.1 L308 28.7"

          <circle cx="308" cy="28.7" r="5" fill="#C6F24E" stroke="#16191D" stroke-width="2"/>
          <circle cx="220" cy="38.3" r="4" fill="#16191D" stroke="#C6F24E" stroke-width="2"/>
        </svg>
        <div style="position:absolute;right:-2px;top:-14px;background:#1F2429;border-radius:6px;padding:5px 9px;display:flex;flex-direction:column;gap:1px">
          <div class="num" style="font-size:14px;font-weight:700;line-height:1">72</div>
          <div style="font-size:9px;color:#9BA3AB">이번 주</div>
        </div>
      </div>

      <div class="num" style="display:flex;justify-content:space-between;font-size:10px;color:#6B737B">
        <span>7/16</span><span>8/6</span><span>8/27</span><span>9/10</span>
      </div>
    </div>
  </div>

  <div style="padding:0 20px 16px;display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;align-items:baseline;gap:8px">
      <div style="font-size:15px;font-weight:600">자주 나오는 문제</div>
      <div class="num" style="font-size:12px;color:#6B737B">최근 8주 · 210 스윙</div>
    </div>

    <div style="display:flex;flex-direction:column;gap:12px">

      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="display:flex;align-items:baseline;gap:8px">
          <span style="font-size:14px;flex:1">체중 이동 부족</span>
          <span class="num" style="font-size:13px;font-weight:600">61%</span>
          <span class="num" style="font-size:11px;font-weight:600;color:#FF8A3D">+8</span>
        </div>
        <div style="height:8px;background:#16191D;border-radius:4px;overflow:hidden">
          <div style="height:8px;width:61%;background:#C6F24E;border-radius:4px"></div>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="display:flex;align-items:baseline;gap:8px">
          <span style="font-size:14px;flex:1">임팩트 시 팔꿈치 과굴곡</span>
          <span class="num" style="font-size:13px;font-weight:600">44%</span>
          <span class="num" style="font-size:11px;font-weight:600;color:#3DDC84">-12</span>

        <div style="height:8px;background:#16191D;border-radius:4px;overflow:hidden">
          <div style="height:8px;width:44%;background:#C6F24E;border-radius:4px"></div>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="display:flex;align-items:baseline;gap:8px">
          <span style="font-size:14px;flex:1">무릎 굽힘 부족</span>
          <span class="num" style="font-size:13px;font-weight:600">29%</span>
          <span class="num" style="font-size:11px;font-weight:600;color:#3DDC84">-5</span>
        </div>
        <div style="height:8px;background:#16191D;border-radius:4px;overflow:hidden">
          <div style="height:8px;width:29%;background:#C6F24E;border-radius:4px"></div>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="display:flex;align-items:baseline;gap:8px">
          <span style="font-size:14px;flex:1">팔로스루 짧음</span>
          <span class="num" style="font-size:13px;font-weight:600">18%</span>
          <span class="num" style="font-size:11px;font-weight:600;color:#3DDC84">-3</span>
        </div>
        <div style="height:8px;background:#16191D;border-radius:4px;overflow:hidden">
          <div style="height:8px;width:18%;background:#C6F24E;border-radius:4px"></div>
        </div>
      </div>

    </div>
  </div>

  <div style="padding:0 20px;flex:1">
    <div style="display:flex;gap:14px;padding:16px 16px 16px 0;background:#16191D;border-radius:14px;overflow:hidden">
      <div style="width:4px;background:#3DDC84;flex-shrink:0"></div>
      <div style="display:flex;flex-direction:column;gap:4px">
        <div style="font-size:15px;font-weight:600">팔꿈치 각도가 좋아지고 있습니다</div>
        <div class="num" style="font-size:12px;color:#9BA3AB">8주 전 56% → 지금 44%</div>
      </div>
    </div>
  </div>

  <div style="height:72px;border-top:1px solid #16191D;display:flex;align-items:center;justify-content:space-around;padding-bottom:8px">
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <rect x="3" y="6" width="16" height="11" rx="2.5" stroke="#6B737B" stroke-width="1.6"/>
        <circle cx="11" cy="11.5" r="3" stroke="#6B737B" stroke-width="1.6"/>
      </svg>
      <span style="font-size:10px;color:#6B737B">촬영</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <rect x="3" y="4" width="7" height="7" rx="1.6" stroke="#6B737B" stroke-width="1.6"/>

        <rect x="3" y="13" width="7" height="5" rx="1.6" stroke="#6B737B" stroke-width="1.6"/>
        <rect x="12" y="13" width="7" height="5" rx="1.6" stroke="#6B737B" stroke-width="1.6"/>
      </svg>
      <span style="font-size:10px;color:#6B737B">보관함</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <path d="M3 16l4.5-5 3.5 3 4-6 4 5" stroke="#C6F24E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span style="font-size:10px;color:#C6F24E;font-weight:600">진척도</span>
    </div>
  </div>

</div>
</x-dc>

</html>
