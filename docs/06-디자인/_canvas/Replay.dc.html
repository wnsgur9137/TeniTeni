<!doctype html>
<html>
<head><meta charset="utf-8"><script src="./support.js"></script></head>
<body>
<x-dc>
<helmet><style>
body{margin:0;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif}
a{color:#C6F24E}a:hover{color:#D9F87E}
.num{font-variant-numeric:tabular-nums}
</style></helmet>
<!-- v1 스윙 리플레이 (세로). SPEC-0123.
     ⚠️ 피드백 카드·스켈레톤·유형 라벨·5페이즈는 **없다** — ReplayDirective/
     ReplaySuggestive가 1-D 목표 상태이고 이것이 지금 서는 것이다.
     영상은 가로(16:9)라 390폭에서 219pt다. 탭하면 ReplayFullscreen으로 간다. -->
<div style="width:390px;height:844px;background:#0B0D0F;color:#F2F4F6;display:flex;flex-direction:column">

  <!-- 헤더 -->
  <div style="padding:16px 20px 14px;display:flex;align-items:center;gap:12px">
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
      <path d="M14 5l-6 6 6 6" stroke="#F2F4F6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div style="flex:1;display:flex;flex-direction:column;gap:2px">
      <div class="num" style="font-size:17px;font-weight:600">스윙 12 <span style="color:#6B737B;font-weight:400">/ 34</span></div>
      <div class="num" style="font-size:12px;color:#6B737B">9월 10일 14:32 · 120fps</div>
    </div>
  </div>

  <!-- 영상 — 가로 클립을 레터박스. 탭하면 전체화면 -->
  <div style="position:relative;height:219px;background:#000;overflow:hidden">
    <div style="position:absolute;inset:0;background:linear-gradient(115deg,#16281c 0%,#12211a 45%,#0d1512 100%)"></div>
    <!-- 사람 전신 ≈ 88pt. 오버레이가 올라갈 자리다 -->
    <div style="position:absolute;left:171px;top:66px">
      <svg width="48" height="88" viewBox="0 0 48 88" fill="none">
        <g stroke="rgba(242,244,246,0.34)" stroke-width="3" stroke-linecap="round">
          <line x1="24" y1="20" x2="24" y2="44"/>
          <line x1="24" y1="24" x2="11" y2="33"/>
          <line x1="24" y1="24" x2="38" y2="18"/>
          <line x1="24" y1="44" x2="16" y2="64"/>
          <line x1="24" y1="44" x2="33" y2="64"/>
          <line x1="16" y1="64" x2="14" y2="82"/>
          <line x1="33" y1="64" x2="36" y2="82"/>
        </g>
        <circle cx="24" cy="13" r="6" fill="none" stroke="rgba(242,244,246,0.34)" stroke-width="3"/>
      </svg>
    </div>
    <div class="num" style="position:absolute;left:14px;bottom:12px;font-size:11px;font-weight:600;padding:4px 8px;border-radius:6px;background:rgba(11,13,15,0.72);color:#F2F4F6">0.62s</div>
    <div style="position:absolute;right:14px;bottom:12px;display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:4px 8px;border-radius:6px;background:rgba(11,13,15,0.72);color:#9BA3AB">
      <svg width="11" height="11" viewBox="0 0 11 11" fill="none">
        <path d="M1 4V1h3M10 7v3H7M7 1h3v3M4 10H1V7" stroke="#9BA3AB" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <span>탭하면 전체화면</span>
    </div>
  </div>

  <!-- 페이즈 스크러버 — 3점만. 5구간 레이블을 적지 않는다 -->
  <div style="padding:20px 20px 0;display:flex;flex-direction:column;gap:9px">
    <div style="position:relative;height:6px;background:#1F2429;border-radius:999px">
      <div style="position:absolute;left:0;top:0;height:6px;width:34%;background:#6B737B;border-radius:999px"></div>
      <div style="position:absolute;left:34%;top:-11px;width:2px;height:28px;background:#C6F24E;margin-left:-1px"></div>
      <div style="position:absolute;left:34%;top:-5px;width:16px;height:16px;border-radius:999px;background:#C6F24E;margin-left:-8px;border:3px solid #0B0D0F"></div>
    </div>
    <div class="num" style="display:flex;justify-content:space-between;font-size:10px;color:#6B737B;font-weight:500">
      <span>0.00</span>
      <span style="color:#C6F24E;font-weight:700">임팩트 0.62</span>
      <span>1.80</span>
    </div>
  </div>

  <!-- 배속 -->
  <div style="padding:18px 20px 0;display:flex;gap:6px">
    <div class="num" style="flex:1;text-align:center;font-size:13px;font-weight:600;padding:9px 0;border-radius:9px;background:#16191D;color:#9BA3AB">0.125×</div>
    <div class="num" style="flex:1;text-align:center;font-size:13px;font-weight:700;padding:9px 0;border-radius:9px;background:#C6F24E;color:#0B0D0F">0.25×</div>
    <div class="num" style="flex:1;text-align:center;font-size:13px;font-weight:600;padding:9px 0;border-radius:9px;background:#16191D;color:#9BA3AB">0.5×</div>
    <div class="num" style="flex:1;text-align:center;font-size:13px;font-weight:600;padding:9px 0;border-radius:9px;background:#16191D;color:#9BA3AB">1×</div>
  </div>

  <!-- 이동 — 프레임 / 재생 / 스윙 -->
  <div style="padding:14px 20px 0;display:flex;align-items:center;gap:10px">
    <div style="flex:1;display:flex;align-items:center;justify-content:center;gap:4px;height:46px;border-radius:11px;background:#16191D">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path d="M11 4L6 9l5 5" stroke="#F2F4F6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M4.5 4v10" stroke="#F2F4F6" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
      <span style="font-size:12px;color:#9BA3AB;font-weight:500">프레임</span>
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path d="M7 4l5 5-5 5" stroke="#F2F4F6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M13.5 4v10" stroke="#F2F4F6" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
    </div>
    <div style="width:46px;height:46px;border-radius:999px;background:#C6F24E;display:flex;align-items:center;justify-content:center">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <rect x="3" y="2.5" width="3.4" height="11" rx="1.1" fill="#0B0D0F"/>
        <rect x="9.6" y="2.5" width="3.4" height="11" rx="1.1" fill="#0B0D0F"/>
      </svg>
    </div>
  </div>

  <div style="padding:10px 20px 0;display:flex;gap:10px">
    <div style="flex:1;display:flex;align-items:center;justify-content:center;gap:7px;height:44px;border-radius:11px;background:#16191D">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M10 3L5 8l5 5" stroke="#9BA3AB" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span style="font-size:13px;color:#9BA3AB;font-weight:500">이전 스윙</span>
    </div>
    <div style="flex:1;display:flex;align-items:center;justify-content:center;gap:7px;height:44px;border-radius:11px;background:#16191D">
      <span style="font-size:13px;color:#F2F4F6;font-weight:500">다음 스윙</span>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M6 3l5 5-5 5" stroke="#F2F4F6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>

  <!-- 비어 있는 아래쪽 — 1-D 피드백 카드가 들어갈 자리다. 지금 채우지 않는다 -->
  <div style="flex:1;margin:18px 20px 24px;border:1px dashed #1F2429;border-radius:14px;display:flex;align-items:center;justify-content:center">
    <div style="font-size:12px;color:#1F2429;font-weight:600;letter-spacing:0.02em">피드백 · 1-D 이후</div>
  </div>

</div>
</x-dc>
</body>
</html>
