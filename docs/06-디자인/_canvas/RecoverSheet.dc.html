<x-dc>
<helmet><style>
body{margin:0;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif}
a{color:#C6F24E}a:hover{color:#D9F87E}
.num{font-variant-numeric:tabular-nums}
</style></helmet>
<!--
  복구 / 폐기 시트 (SPEC-0125).

  `LibraryUnfinished`의 미완 행을 누르면 이것이 올라온다.

  ## 왜 "복구"가 먼저인가

  사용자가 잃은 것은 **영상**이다. 레퍼런스 조사에서 반복된 불만이
  정확히 그것이다 — TennisCut은 촬영 크래시로 녹화가 통째로 사라졌다
  (SwingVision 레퍼런스 2026-10-27절). 되돌릴 수 없는 폐기를 기본 동작
  자리에 두지 않는다.

  ## 스윙 구간이 없다는 것을 숨기지 않는다

  복구는 영상을 살리지만 스윙 구간은 비어 있다. 고아 클립에는 오버레이
  사이드카가 없고(#121의 `OverlayBakeQueue`는 리플레이를 열 때 굽는다),
  재분석은 `AVAssetReader` 패스를 새로 배선하는 일이라 이 작업의 범위를
  넘는다.

  그래서 **복구 버튼 아래에 적는다.** 복구한 뒤 스윙 0개를 보고
  "복구가 실패했나?"로 읽으면 안 된다.

  ## 폐기 문구에 숫자가 있다

  #126이 정한 것 — "정말 지울까요?"만 묻는 것은 확인이 아니라 절차다.
  무엇이 사라지는지 숫자로 적는다.

  ⚠️ 그 숫자는 **스캔 결과**다. 미완 세션 레코드의 `clips`는 0개이므로
  `clips.count`로 구현하면 항상 "클립 0개"로 뜨고, #126이 세운 근거가
  무너진다.

  스윙 수는 적지 않는다 — 모른다. 분석하지 않았다.

  ## 시트 안에서 한 번 더 묻지 않는다

  이 시트 자체가 "이 세션을 어떻게 할까"를 묻는 자리다. 폐기 버튼에
  숫자와 "되돌릴 수 없습니다"가 붙어 있으므로 2단 확인은 절차만 늘린다.

  ## `.mov`가 0개인 미완 세션

  첫 프레임이 오기 전에 죽은 경우다. 찍힌 것이 없으므로 **복구 버튼을
  두지 않고** 폐기만 남긴다. 문구는 "찍힌 영상이 없습니다"로 바뀐다.
  이 아트보드에는 그리지 않았다 — 같은 시트의 버튼 하나가 빠진 형태다.
-->
<div style="width:390px;height:844px;background:#0B0D0F;color:#F2F4F6;position:relative;overflow:hidden;font-family:-apple-system,'SF Pro Text',system-ui,sans-serif">

  <!-- 뒤의 보관함. 딤 처리돼 맥락만 남는다. -->
  <div style="position:absolute;inset:0;opacity:.28">
    <div style="padding:24px 20px 14px;display:flex;flex-direction:column;gap:3px">
      <div style="font-size:28px;font-weight:700">보관함</div>
      <div class="num" style="font-size:13px;color:#6B737B">세션 5개</div>
    </div>
    <div style="padding:0 20px;display:flex;flex-direction:column;gap:1px">
      <div style="background:#1F2429;border-radius:13px 13px 0 0;border-left:3px solid #C6F24E;padding:14px 16px 14px 13px;height:62px"></div>
      <div style="background:#16191D;padding:14px 16px;height:46px"></div>
      <div style="background:#16191D;padding:14px 16px;height:46px"></div>
      <div style="background:#16191D;border-radius:0 0 13px 13px;padding:14px 16px;height:46px"></div>
    </div>
  </div>
  <div style="position:absolute;inset:0;background:rgba(11,13,15,.72)"></div>

  <!-- 시트 -->
  <div style="position:absolute;left:0;right:0;bottom:0;background:#16191D;border-radius:20px 20px 0 0;padding:10px 20px 34px;display:flex;flex-direction:column;gap:18px">

    <div style="width:36px;height:4px;border-radius:2px;background:#6B737B;opacity:.5;align-self:center"></div>

    <div style="display:flex;flex-direction:column;gap:7px">
      <div style="font-size:21px;font-weight:700;line-height:1.25">지난 세션이<br>끝나지 않았습니다</div>
      <div style="font-size:13px;color:#9BA3AB;line-height:1.5">앱이 예기치 않게 종료됐습니다. 찍힌 영상은 디스크에 남아 있습니다.</div>
    </div>

    <!-- 세션 메타. 상황·관찰 대상·fps는 **레코드에서** 온다 —
         촬영 시작 시 레코드를 여는 결정이 이 카드를 가능하게 한다. -->
    <div style="background:#1F2429;border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <span style="font-size:12px;color:#6B737B">촬영 시각</span>
        <span class="num" style="font-size:13px;font-weight:600">11월 5일 · 09:12</span>
      </div>
      <div style="height:1px;background:#0B0D0F"></div>
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <span style="font-size:12px;color:#6B737B">상황</span>
        <span style="font-size:13px;font-weight:600">볼머신 · 내 스윙</span>
      </div>
      <div style="height:1px;background:#0B0D0F"></div>
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <span style="font-size:12px;color:#6B737B">정밀도</span>
        <span class="num" style="font-size:13px;font-weight:600">120fps</span>
      </div>
      <div style="height:1px;background:#0B0D0F"></div>
      <!-- 이 줄만 스캔 결과다. -->
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <span style="font-size:12px;color:#6B737B">찾은 영상</span>
        <span class="num" style="font-size:13px;font-weight:600;color:#C6F24E">클립 3개</span>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:9px">
      <div style="background:#C6F24E;color:#0B0D0F;border-radius:13px;height:52px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700">복구한다</div>
      <div style="display:flex;gap:7px;align-items:flex-start;padding:0 2px">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="flex:none;margin-top:1px">
          <circle cx="7" cy="7" r="6" stroke="#FF8A3D" stroke-width="1.4"/>
          <path d="M7 4v3.4" stroke="#FF8A3D" stroke-width="1.4" stroke-linecap="round"/>
          <circle cx="7" cy="9.8" r=".8" fill="#FF8A3D"/>
        </svg>
        <div style="font-size:12px;color:#9BA3AB;line-height:1.5"><span style="color:#FF8A3D;font-weight:600">스윙 구간은 없습니다.</span> 분석 전에 종료됐습니다 — 영상은 재생할 수 있고, 스윙 단위 리플레이는 쓸 수 없습니다.</div>
      </div>
    </div>

    <div style="height:1px;background:#1F2429;margin:0 -20px"></div>

    <div style="display:flex;flex-direction:column;gap:7px">
      <div style="border:1.5px solid #FF4D4D;border-radius:13px;height:50px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;color:#FF4D4D">폐기한다</div>
      <!-- 무엇이 사라지는지 숫자로. #126의 결정을 그대로 따른다. -->
      <div class="num" style="font-size:12px;color:#6B737B;text-align:center;line-height:1.5">클립 3개를 지웁니다 · <span style="color:#FF4D4D">되돌릴 수 없습니다</span></div>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
