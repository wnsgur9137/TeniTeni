<div style="width:844px;height:390px;background:#0B0D0F;position:relative;color:#F2F4F6;overflow:hidden">

        <div style="position:absolute;right:10px;top:10px;font-size:10px;font-weight:600;padding:4px 8px;border-radius:5px;background:rgba(11,13,15,0.72);color:#C6F24E">임팩트</div>

      <div style="flex:1;display:flex;flex-direction:column;gap:12px">
