<!doctype html>
<html>
<head><meta charset="utf-8"><script src="./support.js"></script></head>
<body>
<x-dc>
<helmet><style>
body{margin:0;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif}
</style></helmet>
<div style="width:390px;height:844px;background:#0B0D0F;color:#F2F4F6;display:flex;flex-direction:column">

  <div style="padding:22px 20px 14px;display:flex;align-items:center;gap:8px">
    <div style="width:8px;height:8px;border-radius:999px;background:#FF4D4D"></div>
    <div style="font-size:13px;color:#9BA3AB;font-variant-numeric:tabular-nums">촬영 계속 중 · 8:31</div>
    <div style="margin-left:auto;font-size:11px;color:#6B737B">랠리 · 120fps</div>
  </div>

  <div style="padding:0 20px">
    <div style="display:flex;align-items:baseline;gap:9px">
      <div style="font-size:22px;font-weight:700">직전 스윙</div>
      <div style="font-size:14px;color:#9BA3AB">포핸드 · 18번째</div>
    </div>
  </div>

  <div style="padding:14px 20px 0">
    <div style="position:relative;height:300px;border-radius:13px;overflow:hidden;background:linear-gradient(160deg,#1b2420 0%,#0f1512 70%)">
      <svg style="position:absolute;left:96px;top:34px" width="200" height="232" viewBox="0 0 200 232">
        <g stroke="rgba(255,255,255,0.72)" stroke-width="3.2" stroke-linecap="round" fill="none">
          <path d="M100 56 L100 124"/><path d="M100 80 L64 112"/>
          <path d="M100 124 L74 186"/><path d="M100 124 L128 186"/>
        </g>
        <path d="M100 80 L148 104" stroke="#4DD8E6" stroke-width="3.6" stroke-linecap="round"/>
        <circle cx="100" cy="38" r="14" stroke="rgba(255,255,255,0.72)" stroke-width="3.2" fill="none"/>
        <g fill="#FFFFFF"><circle cx="100" cy="80" r="4.2"/><circle cx="64" cy="112" r="4.2"/><circle cx="100" cy="124" r="4.2"/><circle cx="128" cy="186" r="4.2"/></g>
        <circle cx="74" cy="186" r="9" stroke="#FF4D4D" stroke-width="2.6" fill="none"/>
        <circle cx="74" cy="186" r="4.2" fill="#FF4D4D"/>
      </svg>
      <div style="position:absolute;left:14px;bottom:12px;font-size:11px;font-weight:600;padding:5px 10px;border-radius:6px;background:rgba(11,13,15,0.72);color:#9BA3AB">임팩트</div>
    </div>
  </div>

  <div style="padding:16px 20px 0">
    <div style="background:#16191D;border-radius:13px;padding:16px;border-left:3px solid #C6F24E">
      <div style="font-size:17px;font-weight:600;line-height:1.45">앞발에 체중을 더 실어보세요</div>
      <div style="font-size:13px;color:#9BA3AB;margin-top:6px;font-variant-numeric:tabular-nums">112° · 권장 150~170°</div>
    </div>
  </div>

  <div style="padding:14px 20px 0;display:flex;gap:10px">
    <div style="flex:1;background:#16191D;border-radius:11px;padding:14px">
      <div style="font-size:26px;font-weight:700;font-variant-numeric:tabular-nums">64</div>
      <div style="font-size:11px;color:#9BA3AB;margin-top:2px">이번 스윙</div>
    </div>
    <div style="flex:1;background:#16191D;border-radius:11px;padding:14px">
      <div style="display:flex;align-items:baseline;gap:6px">
        <div style="font-size:26px;font-weight:700;font-variant-numeric:tabular-nums">71</div>
        <div style="font-size:13px;font-weight:600;color:#3DDC84;font-variant-numeric:tabular-nums">+3</div>
      </div>
      <div style="font-size:11px;color:#9BA3AB;margin-top:2px">오늘 평균</div>
    </div>
  </div>

  <div style="flex:1"></div>

  <div style="padding:14px 20px 30px;display:flex;gap:10px">
    <button style="flex:1;height:52px;border:1px solid #1F2429;border-radius:10px;background:#16191D;color:#9BA3AB;font-size:16px;font-weight:500;font-family:inherit;cursor:pointer">자세히 보기</button>
    <button style="flex:1;height:52px;border:none;border-radius:10px;background:#C6F24E;color:#0B0D0F;font-size:17px;font-weight:600;font-family:inherit;cursor:pointer">계속 치기</button>
  </div>

</div>
</x-dc>
</body>
</html>
