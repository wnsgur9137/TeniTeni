<!doctype html>
<html>
<head><meta charset="utf-8"><script src="./support.js"></script></head>
<body>
<x-dc>
<helmet><style>
body{margin:0;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif}
a{color:#C6F24E}a:hover{color:#D9F87E}
</style></helmet>
<div style="width:390px;height:844px;background:#0B0D0F;color:#F2F4F6;display:flex;flex-direction:column">

  <div style="padding:28px 20px 20px;display:flex;flex-direction:column;gap:6px">
    <div style="font-size:28px;font-weight:700">오늘은 어떻게 치나요</div>
    <div style="font-size:13px;color:#9BA3AB">모드에 따라 촬영 중 화면과 알림이 달라집니다</div>
  </div>

  <div style="padding:0 20px;display:flex;flex-direction:column;gap:12px;flex:1">

    <div style="background:#16191D;border:2px solid #C6F24E;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:center;gap:10px">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
          <circle cx="11" cy="11" r="8" stroke="#C6F24E" stroke-width="1.7"/>
          <path d="M11 6v5l3.5 2" stroke="#C6F24E" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <div style="font-size:17px;font-weight:600;flex:1">연속</div>
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <circle cx="10" cy="10" r="9" fill="#C6F24E"/>
          <path d="M6 10.5l2.5 2.5L14 7.5" stroke="#0B0D0F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div style="font-size:13px;color:#9BA3AB;line-height:1.5">볼머신·벽치기처럼 계속 칠 때.<br>스윙마다 소리로 알려주니 폰을 보러 오지 않아도 됩니다.</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <span style="font-size:11px;font-weight:500;padding:4px 8px;border-radius:6px;background:#1F2429;color:#9BA3AB">감지음 켜짐</span>
        <span style="font-size:11px;font-weight:500;padding:4px 8px;border-radius:6px;background:#1F2429;color:#9BA3AB">피드백은 세션 후</span>
      </div>
    </div>

    <div style="background:#16191D;border:1px solid #1F2429;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:center;gap:10px">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
          <path d="M4 11h5M13 11h5" stroke="#9BA3AB" stroke-width="1.7" stroke-linecap="round"/>
          <circle cx="11" cy="11" r="2" fill="#9BA3AB"/>
          <path d="M11 3v3M11 16v3" stroke="#9BA3AB" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <div style="font-size:17px;font-weight:600;flex:1">랠리</div>
        <div style="width:20px;height:20px;border-radius:999px;border:1.5px solid #6B737B"></div>
      </div>
      <div style="font-size:13px;color:#9BA3AB;line-height:1.5">상대와 주고받을 때.<br>체인지나 휴식 때 직전 스윙을 빠르게 확인할 수 있습니다.</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <span style="font-size:11px;font-weight:500;padding:4px 8px;border-radius:6px;background:#1F2429;color:#9BA3AB">중간 확인 가능</span>
      </div>
    </div>

    <div style="background:#16191D;border:1px solid #1F2429;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:center;gap:10px">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
          <circle cx="8" cy="7" r="3" stroke="#9BA3AB" stroke-width="1.7"/>
          <circle cx="15" cy="9" r="2.5" stroke="#9BA3AB" stroke-width="1.7"/>
          <path d="M3 18c0-3 2.2-5 5-5s5 2 5 5" stroke="#9BA3AB" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <div style="font-size:17px;font-weight:600;flex:1">레슨</div>
        <div style="width:20px;height:20px;border-radius:999px;border:1.5px solid #6B737B"></div>
      </div>
      <div style="font-size:13px;color:#9BA3AB;line-height:1.5">코치와 함께 볼 때.<br>자동 피드백은 줄이고 즉석 리플레이 위주로 동작합니다.</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <span style="font-size:11px;font-weight:500;padding:4px 8px;border-radius:6px;background:#1F2429;color:#9BA3AB">감지음 꺼짐</span>
      </div>
    </div>

  </div>

  <div style="padding:16px 20px 32px;display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#16191D;border-radius:10px">
      <div style="display:flex;flex-direction:column;gap:2px">
        <div style="font-size:15px;font-weight:600">정밀 120fps</div>
        <div style="font-size:11px;color:#6B737B">배터리·저장공간을 더 씁니다</div>
      </div>
      <div style="width:48px;height:28px;border-radius:999px;background:#C6F24E;position:relative">
        <div style="position:absolute;right:3px;top:3px;width:22px;height:22px;border-radius:999px;background:#0B0D0F"></div>
      </div>
    </div>
    <button style="height:52px;border:none;border-radius:10px;background:#C6F24E;color:#0B0D0F;font-size:17px;font-weight:600;font-family:inherit;cursor:pointer">카메라 맞추기</button>
  </div>

</div>
</x-dc>
</body>
</html>
