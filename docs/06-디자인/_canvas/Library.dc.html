<!doctype html>
<html>
<head><meta charset="utf-8"><script src="./support.js"></script></head>
<body>
<x-dc>
<helmet><style>
body{margin:0;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif}
a{color:#C6F24E}a:hover{color:#D9F87E}
.num{font-variant-numeric:tabular-nums}
</style></helmet>
<div style="width:390px;height:844px;background:#0B0D0F;color:#F2F4F6;display:flex;flex-direction:column">

  <div style="padding:24px 20px 14px;display:flex;flex-direction:column;gap:12px">
    <div style="font-size:28px;font-weight:700">보관함</div>
    <div style="display:flex;gap:8px">
      <span style="font-size:13px;font-weight:600;padding:7px 14px;border-radius:999px;background:#C6F24E;color:#0B0D0F">전체</span>
      <span style="font-size:13px;font-weight:500;padding:7px 14px;border-radius:999px;background:#16191D;color:#9BA3AB">포핸드</span>
      <span style="font-size:13px;font-weight:500;padding:7px 14px;border-radius:999px;background:#16191D;color:#9BA3AB">백핸드</span>
      <span style="font-size:13px;font-weight:500;padding:7px 14px;border-radius:999px;background:#16191D;color:#9BA3AB">서브</span>
    </div>
  </div>

  <div style="flex:1;padding:0 20px;display:flex;flex-direction:column;gap:18px;overflow:hidden">

    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:baseline;gap:8px">
        <div style="font-size:13px;font-weight:600">오늘</div>
        <div class="num" style="font-size:12px;color:#6B737B">34 스윙 · 12분</div>
        <div style="flex:1"></div>
        <div style="font-size:11px;font-weight:500;padding:3px 8px;border-radius:5px;background:#1F2429;color:#9BA3AB">연속</div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
        <div style="aspect-ratio:1;border-radius:10px;background:linear-gradient(140deg,#16281c,#0d1512);position:relative">
          <div class="num" style="position:absolute;right:6px;bottom:6px;font-size:12px;font-weight:700">64</div>
          <div style="position:absolute;left:6px;top:6px;width:6px;height:6px;border-radius:999px;background:#FF4D4D"></div>
        </div>
        <div style="aspect-ratio:1;border-radius:10px;background:linear-gradient(140deg,#16281c,#0d1512);position:relative">
          <div class="num" style="position:absolute;right:6px;bottom:6px;font-size:12px;font-weight:700">81</div>
          <div style="position:absolute;left:6px;top:6px;width:6px;height:6px;border-radius:999px;background:#3DDC84"></div>
        </div>
        <div style="aspect-ratio:1;border-radius:10px;background:linear-gradient(140deg,#16281c,#0d1512);position:relative">
          <div class="num" style="position:absolute;right:6px;bottom:6px;font-size:12px;font-weight:700">70</div>
        </div>
        <div style="aspect-ratio:1;border-radius:10px;background:linear-gradient(140deg,#16281c,#0d1512);position:relative">
          <div class="num" style="position:absolute;right:6px;bottom:6px;font-size:12px;font-weight:700">76</div>
        </div>
        <div style="aspect-ratio:1;border-radius:10px;background:linear-gradient(140deg,#16281c,#0d1512);position:relative">
          <div class="num" style="position:absolute;right:6px;bottom:6px;font-size:12px;font-weight:700">59</div>
          <div style="position:absolute;left:6px;top:6px;width:6px;height:6px;border-radius:999px;background:#FF4D4D"></div>
        </div>
        <div style="aspect-ratio:1;border-radius:10px;background:#16191D;display:flex;align-items:center;justify-content:center">
          <span class="num" style="font-size:13px;font-weight:600;color:#9BA3AB">+29</span>
        </div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:baseline;gap:8px">
        <div style="font-size:13px;font-weight:600">9월 7일</div>
        <div class="num" style="font-size:12px;color:#6B737B">22 스윙 · 9분</div>
        <div style="flex:1"></div>
        <div style="font-size:11px;font-weight:500;padding:3px 8px;border-radius:5px;background:#1F2429;color:#9BA3AB">랠리</div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
        <div style="aspect-ratio:1;border-radius:10px;background:linear-gradient(140deg,#1a2418,#0d1512);position:relative">
          <div class="num" style="position:absolute;right:6px;bottom:6px;font-size:12px;font-weight:700">68</div>
        </div>
        <div style="aspect-ratio:1;border-radius:10px;background:linear-gradient(140deg,#1a2418,#0d1512);position:relative">
          <div class="num" style="position:absolute;right:6px;bottom:6px;font-size:12px;font-weight:700">72</div>
        </div>
        <div style="aspect-ratio:1;border-radius:10px;background:#16191D;display:flex;align-items:center;justify-content:center">
          <span class="num" style="font-size:13px;font-weight:600;color:#9BA3AB">+20</span>
        </div>
      </div>
    </div>

  </div>

  <div style="height:72px;border-top:1px solid #16191D;display:flex;align-items:center;justify-content:space-around;padding-bottom:8px">
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <rect x="3" y="6" width="16" height="11" rx="2.5" stroke="#6B737B" stroke-width="1.6"/>
        <circle cx="11" cy="11.5" r="3" stroke="#6B737B" stroke-width="1.6"/>
      </svg>
      <span style="font-size:10px;color:#6B737B">촬영</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <rect x="3" y="4" width="7" height="7" rx="1.6" stroke="#C6F24E" stroke-width="1.6"/>
        <rect x="12" y="4" width="7" height="7" rx="1.6" stroke="#C6F24E" stroke-width="1.6"/>
        <rect x="3" y="13" width="7" height="5" rx="1.6" stroke="#C6F24E" stroke-width="1.6"/>
        <rect x="12" y="13" width="7" height="5" rx="1.6" stroke="#C6F24E" stroke-width="1.6"/>
      </svg>
      <span style="font-size:10px;color:#C6F24E;font-weight:600">보관함</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <path d="M3 16l4.5-5 3.5 3 4-6 4 5" stroke="#6B737B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span style="font-size:10px;color:#6B737B">진척도</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
