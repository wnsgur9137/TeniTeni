<!doctype html>
<html>
<head><meta charset="utf-8"><script src="./support.js"></script></head>
<body>
<x-dc>
<helmet><style>
body{margin:0;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif}
a{color:#C6F24E}a:hover{color:#D9F87E}
.num{font-variant-numeric:tabular-nums}
</style></helmet>
<!--
  보관함 — 과거 세션 목록 (SPEC-0116).

  ⚠️ 이 아트보드는 **유형 필터와 스윙 썸네일 그리드를 들고 있었다.** 둘 다
  지웠다.

  - 유형 필터(포핸드/백핸드/서브)는 **1-D 분류가 생긴 뒤**에야 축이 있다
  - 썸네일의 점수(64·81·…)도 1-D가 만든다. 통영상에서 프레임을 꺼내는
    일이기도 해서 목록 성능 문제를 같이 들고 온다

  남은 것은 세션 한 줄이다. 레퍼런스 조사에서 반복된 불만은 "찾기 어렵다"가
  아니라 **"사라졌다"**였으므로(SwingVision 레퍼런스 2026-10-27절), 이 화면의
  첫 일은 탐색이 아니라 **찍은 것이 살아 있다는 증거**다.

  fps를 줄마다 적는 이유: 발열로 강등되면 세션마다 다르다(ADR-0005).
-->
<div style="width:390px;height:844px;background:#0B0D0F;color:#F2F4F6;display:flex;flex-direction:column">

  <div style="padding:24px 20px 14px;display:flex;flex-direction:column;gap:3px">
    <div style="font-size:28px;font-weight:700">보관함</div>
    <div class="num" style="font-size:13px;color:#6B737B">세션 4개</div>
  </div>

  <div style="flex:1;padding:0 20px;display:flex;flex-direction:column;gap:1px;overflow:hidden">

    <div style="background:#16191D;border-radius:13px 13px 0 0;padding:14px 16px;display:flex;align-items:center;gap:12px">
      <div style="flex:1;display:flex;flex-direction:column;gap:4px">
        <div class="num" style="font-size:15px;font-weight:600">10월 27일 · 14:32</div>
        <div class="num" style="font-size:12px;color:#6B737B">볼머신 · 내 스윙 · 클립 3개 · 120fps</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px">
        <div class="num" style="font-size:20px;font-weight:700;font-feature-settings:'tnum'">12</div>
        <div style="font-size:10px;color:#6B737B">스윙</div>
      </div>
      <svg width="8" height="14" viewBox="0 0 8 14" fill="none"><path d="M1.5 1.5L6 7l-4.5 5.5" stroke="#6B737B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>

    <div style="background:#16191D;padding:14px 16px;display:flex;align-items:center;gap:12px">
      <div style="flex:1;display:flex;flex-direction:column;gap:4px">
        <div class="num" style="font-size:15px;font-weight:600">10월 26일 · 19:04</div>
        <div class="num" style="font-size:12px;color:#6B737B">랠리 · 내 스윙 · 클립 5개 · 120fps</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px">
        <div class="num" style="font-size:20px;font-weight:700">23</div>
        <div style="font-size:10px;color:#6B737B">스윙</div>
      </div>
      <svg width="8" height="14" viewBox="0 0 8 14" fill="none"><path d="M1.5 1.5L6 7l-4.5 5.5" stroke="#6B737B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>

    <!-- 발열로 60fps로 강등된 세션. 줄마다 fps를 적는 이유가 이것이다. -->
    <div style="background:#16191D;padding:14px 16px;display:flex;align-items:center;gap:12px">
      <div style="flex:1;display:flex;flex-direction:column;gap:4px">
        <div class="num" style="font-size:15px;font-weight:600">10월 24일 · 18:11</div>
        <div class="num" style="font-size:12px;color:#6B737B">랠리 · 내 스윙 · 클립 4개 · <span style="color:#FF8A3D">60fps</span></div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px">
        <div class="num" style="font-size:20px;font-weight:700">17</div>
        <div style="font-size:10px;color:#6B737B">스윙</div>
      </div>
      <svg width="8" height="14" viewBox="0 0 8 14" fill="none"><path d="M1.5 1.5L6 7l-4.5 5.5" stroke="#6B737B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>

    <!-- 스윙 0개 세션도 목록에 남는다. 영상은 있으므로 지우지 않는다
         (SPEC-0110). 누르면 요약이 아니라 진단(EmptySession)이 뜬다. -->
    <div style="background:#16191D;border-radius:0 0 13px 13px;padding:14px 16px;display:flex;align-items:center;gap:12px">
      <div style="flex:1;display:flex;flex-direction:column;gap:4px">
        <div class="num" style="font-size:15px;font-weight:600">10월 22일 · 17:48</div>
        <div class="num" style="font-size:12px;color:#6B737B">벽 · 내 스윙 · 클립 1개 · 120fps</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px">
        <div class="num" style="font-size:20px;font-weight:700;color:#6B737B">0</div>
        <div style="font-size:10px;color:#6B737B">스윙</div>
      </div>
      <svg width="8" height="14" viewBox="0 0 8 14" fill="none"><path d="M1.5 1.5L6 7l-4.5 5.5" stroke="#6B737B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>

  </div>

  <div style="height:72px;border-top:1px solid #16191D;display:flex;align-items:center;justify-content:space-around;padding-bottom:8px">
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <rect x="3" y="6" width="16" height="11" rx="2.5" stroke="#6B737B" stroke-width="1.6"/>
        <circle cx="11" cy="11.5" r="3" stroke="#6B737B" stroke-width="1.6"/>
      </svg>
      <span style="font-size:10px;color:#6B737B">촬영</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <rect x="3" y="4" width="7" height="7" rx="1.6" stroke="#C6F24E" stroke-width="1.6"/>
        <rect x="12" y="4" width="7" height="7" rx="1.6" stroke="#C6F24E" stroke-width="1.6"/>
        <rect x="3" y="13" width="7" height="5" rx="1.6" stroke="#C6F24E" stroke-width="1.6"/>
        <rect x="12" y="13" width="7" height="5" rx="1.6" stroke="#C6F24E" stroke-width="1.6"/>
      </svg>
      <span style="font-size:10px;color:#C6F24E;font-weight:600">보관함</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <path d="M3 16l4.5-5 3.5 3 4-6 4 5" stroke="#6B737B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span style="font-size:10px;color:#6B737B">진척도</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
