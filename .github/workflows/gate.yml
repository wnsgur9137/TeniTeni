name: Gate

# paths 필터를 두지 않는다. 모든 PR에서 정확히 하나의 필수 체크가 실행되어야
# 브랜치 보호의 required status check가 성립한다.
# paths로 워크플로를 나누면 해당 없는 PR에서 체크가 pending으로 남아 병합이 막힌다.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 변경 경로를 판정해 어떤 검증이 필요한지 결정한다
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        # core.quotePath=false가 없으면 git이 한글 경로를 따옴표로 감싸고
        # 옥탈 이스케이프한다 ("docs/05-\352\262\260.../x.md"). 그러면 아래
        # ^docs/ 패턴이 전부 빗나가 문서 검증이 조용히 건너뛰어진다.
        # docs/ 하위 폴더명이 전부 한글이므로 문서 게이트가 통째로 무력화된다.
        run: |
          GIT="git -c core.quotePath=false"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
            git fetch origin "${{ github.base_ref }}" --depth=1 2>/dev/null || true
            CHANGED=$($GIT diff --name-only "$BASE"...HEAD 2>/dev/null || $GIT ls-files)
          else
            CHANGED=$($GIT diff --name-only HEAD~1 HEAD 2>/dev/null || $GIT ls-files)
          fi
          echo "변경 파일:"; printf '%s\n' "$CHANGED" | sed 's/^/  /'

          ios=false; docs=false
          if printf '%s\n' "$CHANGED" | grep -qE '^(ios/|scripts/verify-ios\.sh|mise\.toml)'; then ios=true; fi
          # Tokens.swift는 코드지만 문서 게이트가 DESIGN-SYSTEM.md와 대조하므로
          # 그것만 바뀌어도 문서 검증을 돌려야 한다.
          if printf '%s\n' "$CHANGED" | grep -qE '^(docs/|README\.md|scripts/verify-docs\.sh|ios/TeniTeni/Sources/DesignSystem/)'; then docs=true; fi
          # 워크플로 자체가 바뀌면 둘 다 검증
          if printf '%s\n' "$CHANGED" | grep -qE '^\.github/workflows/'; then ios=true; docs=true; fi

          echo "ios=$ios"  >> "$GITHUB_OUTPUT"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"
          printf '\niOS 검증: %s / 문서 검증: %s\n' "$ios" "$docs"

  # PR이 커지는 것을 막지는 않되 눈에 띄게 한다.
  # 규약 12.8 "PR 단위 — 작게 가져갑니다" 참고.
  size:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 변경 규모 집계
        env:
          LIMIT: 400
        run: |
          BASE="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --depth=1 2>/dev/null || true

          # -M(이름변경 탐지)이 핵심이다. 없으면 파일 이동이 "삭제 + 추가"로
          # 두 번 세어져 실제보다 크게 나온다 (PR #15: 표시 725 / 실제 526).
          # diff를 못 구하면 0줄로 읽혀 경고가 영영 안 뜬다.
          # 규약 12.7 "게이트가 조용히 통과하는 함정"의 바로 그 유형이므로
          # 조용히 넘어가지 않고 실패시킨다.
          if ! NUMSTAT=$(git diff --numstat -M "$BASE"...HEAD); then
            echo "::error::$BASE 와의 diff를 구하지 못했습니다"
            exit 1
          fi

          # 바이너리는 numstat이 "-"를 내므로 숫자 행만 센다
          read -r ADD DEL <<EOF
          $(printf '%s\n' "$NUMSTAT" | awk '$1 ~ /^[0-9]+$/ {a+=$1; d+=$2} END {print a+0, d+0}')
          EOF
          # 기준은 "추가 줄"이다. 삭제는 리뷰 부담이 훨씬 작으므로 세지 않는다
          # (1000줄을 지우고 10줄을 넣은 PR은 큰 PR이 아니다).
          printf '변경 규모 (이름변경 탐지 후): +%s/-%s — 기준은 추가 %s줄\n' "$ADD" "$DEL" "$LIMIT"

          {
            echo "### PR 규모"
            echo ""
            echo "추가 **$ADD줄** / 삭제 $DEL줄 (기준: 추가 $LIMIT줄)"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$ADD" -gt "$LIMIT" ]; then
            echo "::warning::추가 ${ADD}줄입니다 (기준 ${LIMIT}줄). 쪼갤 수 없는 이유를 PR 본문에 적으세요 — 규약 12.8"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ 기준 초과. 쪼갤 수 없는 이유를 PR 본문에 적으세요 ([규약 12.8](../blob/main/docs/09-프로세스/PIPELINE.md))." >> "$GITHUB_STEP_SUMMARY"
          fi

  docs:
    needs: detect
    if: needs.detect.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: ./scripts/verify-docs.sh

  # iOS 검증을 세 잡으로 쪼개 **병렬로** 돌린다.
  #
  # ⚠️ 전에는 잡 하나가 전부를 직렬로 돌렸다. 성공한 실행이 20.7분·20.8분
  # 이었는데 상한이 30분이라 여유가 9분뿐이었고, macOS 러너의 변동폭이
  # 그것을 먹었다. #110의 실행은 30분 30초에 **취소**됐고(실패가 아니다)
  # `gate`가 그 취소를 실패로 집계해 병합이 막혔다 — 코드에는 문제가 없었다.
  # 상한을 45분으로 올려 당장은 풀었지만 그것은 증상 완화였다.
  #
  # 쪼개면 각 잡의 상한을 다시 좁게 잡을 수 있고, **어느 축이 느려지는지**도
  # 드러난다. 근거: #113
  #
  # | 잡 | 내용 | 시뮬레이터 |
  # |---|---|---|
  # | `ios-build` | 앱 빌드 + iOS 단위 테스트 3타깃 | 필요 |
  # | `ios-ui`    | UI 테스트 | 필요 |
  # | `macos`     | TeniTool · TeniVision | 불필요 |
  #
  # 세 잡이 각각 전체 빌드를 치르므로 **총 CPU 시간은 늘어난다.** 그것을
  # 받아들이는 이유는 (1) 벽시계 시간이 줄고 (2) 전체 빌드라서 경고 집계가
  # 여전히 사각 없이 나오기 때문이다 — 캐시로 줄이면 그 사각이 돌아온다.
  ios-build:
    needs: detect
    if: needs.detect.outputs.ios == 'true'
    # ⚠️ macos-15는 Xcode 16.4(Swift 6.1)이고 iOS 26 SDK가 없다.
    # 우리 타깃은 iOS 26이므로 게이트가 표현할 수 없는 플랫폼을 검증해 왔다.
    # 1-A에서 로컬(Xcode 26.6)은 통과하는데 CI만 깨지며 드러났다.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: ./.github/actions/setup-ios
      - name: 게이트 실행 (빌드 + 단위 테스트)
        run: mise exec -- ./scripts/verify-ios.sh --phase=ios
      - name: 빌드 로그 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-ios
          path: /tmp/teniteni-*.log
          retention-days: 7

  ios-ui:
    needs: detect
    if: needs.detect.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: ./.github/actions/setup-ios
      - name: 게이트 실행 (UI 테스트)
        run: mise exec -- ./scripts/verify-ios.sh --phase=ui
      - name: 빌드 로그 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-ui
          path: /tmp/teniteni-*.log
          retention-days: 7

  macos:
    needs: detect
    if: needs.detect.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: ./.github/actions/setup-ios
      - name: 게이트 실행 (macOS)
        run: mise exec -- ./scripts/verify-ios.sh --phase=macos
      - name: 빌드 로그 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-macos
          path: /tmp/teniteni-*.log
          retention-days: 7

  # ★ 브랜치 보호의 required status check로 지정할 잡.
  # 항상 실행되며, 건너뛴 잡은 성공으로 간주하고 실패한 잡만 잡아낸다.
  #
  # `cancelled`를 실패로 보는 것은 **의도한 것이다.** 취소된 검증을 통과로
  # 둘 수는 없다. 고칠 곳은 집계가 아니라 타임아웃에 닿는 구조였다.
  gate:
    needs: [detect, docs, ios-build, ios-ui, macos]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 결과 집계
        # ⚠️ 하이픈이 들어간 잡 id는 **대괄호로 읽는다.**
        # `needs.ios-build.result`는 표현식 문법에서 뺄셈으로 읽힐 수 있다.
        env:
          DETECT: ${{ needs.detect.result }}
          DOCS: ${{ needs.docs.result }}
          IOS_BUILD: ${{ needs['ios-build'].result }}
          IOS_UI: ${{ needs['ios-ui'].result }}
          MACOS: ${{ needs.macos.result }}
        run: |
          # size는 경고 전용이므로 판정에 넣지 않는다.
          fail=0
          for pair in "detect=$DETECT" "docs=$DOCS" \
                      "ios-build=$IOS_BUILD" "ios-ui=$IOS_UI" "macos=$MACOS"; do
            name="${pair%%=*}"
            result="${pair#*=}"
            printf '%-10s %s\n' "$name" "$result"
            case "$result" in
              success|skipped) ;;
              # cancelled도 여기로 온다. **의도한 것이다** — 취소된 검증을
              # 통과로 둘 수는 없다.
              *) fail=1; echo "::error::$name: $result" ;;
            esac
          done

          if [ "$fail" -eq 1 ]; then
            echo "::error::검증 실패 — 위 결과를 확인하세요"
            exit 1
          fi
          echo "게이트 통과"
