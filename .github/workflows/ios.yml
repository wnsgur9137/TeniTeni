name: iOS

on:
  pull_request:
    paths:
      - 'ios/**'
      - 'scripts/verify-ios.sh'
      - 'mise.toml'
      - '.github/workflows/ios.yml'
  push:
    branches: [main]
    paths:
      - 'ios/**'

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: mise 설치 (Tuist 버전 고정)
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: 툴체인 설치
        run: |
          mise trust
          mise install

      - name: Xcode 선택
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: 게이트 실행
        run: mise exec -- ./scripts/verify-ios.sh

      - name: 빌드 로그 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/teniteni-build.log
          retention-days: 7
