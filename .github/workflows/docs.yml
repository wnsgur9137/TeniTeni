name: Docs

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'scripts/verify-docs.sh'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 문서 게이트 실행
        run: ./scripts/verify-docs.sh
